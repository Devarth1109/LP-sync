<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verify Password</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }

        .login-form {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .login-form h2 {
            color: #333;
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 600;
        }

        .login-form input[type="password"] {
            width: 100%;
            padding: 15px 20px;
            margin-bottom: 20px;
            border: 2px solid #e1e5e9;
            border-radius: 50px;
            font-size: 1rem;
            background: rgba(255, 255, 255, 0.8);
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .login-form input[type="password"]:focus {
            outline: none;
            border-color: #1b4f72;
            box-shadow: 0 0 0 3px rgba(27, 79, 114, 0.1);
        }

        .login-form button {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #1b4f72 0%, #2980b9 100%);
            color: white;
            border: none;
            border-radius: 50px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .login-form button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(27, 79, 114, 0.3);
        }

        .error-message {
            color: #e74c3c;
            background: rgba(231, 76, 60, 0.1);
            padding: 10px 15px;
            border-radius: 10px;
            margin-top: 15px;
            font-size: 0.9rem;
            border-left: 4px solid #e74c3c;
        }

        .user-info {
            background: rgba(27, 79, 114, 0.1);
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 25px;
            color: #1b4f72;
            font-weight: 500;
        }

        .user-info i {
            margin-right: 8px;
            opacity: 0.8;
        }
    </style>
</head>
<body>
    <form class="login-form" action="{% url 'project_sync_v_pswd' user.id %}" method="POST">
        {% csrf_token %}
        <h2>Verify Password</h2>
        
        <div class="user-info">
            <i class="fas fa-user-circle"></i>
            {{ user.email }}
        </div>
        
        <input type="password" name="v_password" placeholder="Enter Password" required>
        <button type="submit">
            <i class="fas fa-lock mr-2"></i>
            Verify Password
        </button>

        <a href="{% url 'fpswd' %}">Forgot Password?</a>
        
        {% if error %}
        <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i>
            {{ error }}
        </div>
        {% endif %}
    </form>
</body>
</html>
